name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  check:
    name: Rust compile check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev

      - name: Prepare server bundle (build.rs resource glob needs it)
        run: node scripts/prepare-server.js

      - name: Cargo check (locked)
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

  release:
    name: Build, sign and release
    needs: check
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Import Apple certificate into temporary keychain
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$APPLE_CERTIFICATE" | base64 --decode > /tmp/certificate.p12
          security import /tmp/certificate.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      # Sign .node native addons BEFORE tauri build copies them into the bundle.
      # If they are unsigned, Apple's notarization will reject the whole app.
      - name: Codesign native Node.js addons
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          echo "Signing .node files in node_modules..."
          find node_modules -name "*.node" -print | while read f; do
            echo "  → $f"
            codesign --force \
                     --sign "$APPLE_SIGNING_IDENTITY" \
                     --options runtime \
                     --timestamp \
                     "$f"
          done
          echo "Done signing native addons."

      - name: Build, sign, notarize and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'LB Liquidator ${{ github.ref_name }}'
          releaseBody: |
            ## LB Liquidator ${{ github.ref_name }}

            ### Install
            Download the `.dmg` below and drag **LB Liquidator.app** into your Applications folder.

            ### Auto-update
            If you already have LB Liquidator installed, it will prompt you to update automatically on next launch.
          # Keep the release a draft until every asset (incl. latest.json) is
          # uploaded; the "Publish release" step below flips it public. Otherwise
          # the updater 404s on releases/latest/download/latest.json mid-upload.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          assets=$(gh release view "$TAG" --json assets -q '.assets[].name')
          echo "Draft assets:"
          echo "$assets"
          missing=0
          for pattern in '^latest\.json$' '\.dmg$' '\.app\.tar\.gz$' '\.app\.tar\.gz\.sig$'; do
            if ! echo "$assets" | grep -Eq "$pattern"; then
              echo "::error::Draft release $TAG is missing an asset matching $pattern"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

          # Draft releases may report asset URLs under an "untagged-<hash>" tag,
          # which would 404 once published. Make latest.json point at the real tag.
          mkdir -p "$RUNNER_TEMP/updater"
          gh release download "$TAG" --pattern latest.json --dir "$RUNNER_TEMP/updater" --clobber
          if grep -q '/releases/download/untagged-' "$RUNNER_TEMP/updater/latest.json"; then
            echo "Rewriting untagged URLs in latest.json to $TAG"
            sed -i '' -E "s#/releases/download/untagged-[^/]+/#/releases/download/$TAG/#g" "$RUNNER_TEMP/updater/latest.json"
            gh release upload "$TAG" "$RUNNER_TEMP/updater/latest.json" --clobber
          fi
          if ! grep -q "/releases/download/$TAG/" "$RUNNER_TEMP/updater/latest.json"; then
            echo "::error::latest.json does not reference /releases/download/$TAG/"
            exit 1
          fi

          gh release edit "$TAG" --draft=false --latest

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true
          rm -f /tmp/certificate.p12
