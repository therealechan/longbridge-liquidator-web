<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liquidator</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none' stroke='currentColor' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M16 2L2 9l14 7 14-7-14-7z'/%3E%3Cpath d='M2 9v14l14 7 14-7V9'/%3E%3Cpath d='M16 16v14'/%3E%3Cpath d='M16 16L2 9'/%3E%3C/svg%3E" />
  <meta name="description" content="Longbridge Liquidator - One-click position liquidation tool" />
  
  <!-- Geist Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    :root {
      --background: #ffffff;
      --surface: #f4f4f5;
      --surface-hover: #e4e4e7;
      --border: #e4e4e7;
      --foreground: #18181b;
      --foreground-secondary: #3f3f46;
      --muted: #71717a;
      --muted-foreground: #a1a1aa;
      --accent: #18181b;
      --accent-foreground: #fafafa;
      --danger: #dc2626;
      --danger-hover: #b91c1c;
      --success: #16a34a;
      --radius: 6px;
      --radius-sm: 4px;
    }

    .dark {
      --background: #0a0a0a;
      --surface: #171717;
      --surface-hover: #262626;
      --border: #262626;
      --foreground: #ededed;
      --foreground-secondary: #d4d4d4;
      --muted: #737373;
      --muted-foreground: #a3a3a3;
      --accent: #fafafa;
      --accent-foreground: #171717;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html { scroll-behavior: smooth; }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--background);
      color: var(--foreground);
      line-height: 1.6;
      min-height: 100vh;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--background); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

    .container { max-width: 640px; margin: 0 auto; padding: 60px 24px 40px; }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 48px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand svg {
      width: 28px;
      height: 28px;
      color: var(--foreground);
    }

    .brand-text {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .lang-selector {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 6px 10px;
      font-size: 13px;
      color: var(--foreground);
      cursor: pointer;
      font-family: inherit;
    }

    .lang-selector:focus { outline: none; border-color: var(--foreground); }

    .theme-toggle {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px;
      cursor: pointer;
      color: var(--foreground);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .theme-toggle:hover { background: var(--surface); }

    /* Hero */
    .hero { margin-bottom: 40px; }
    .hero h1 { font-size: 36px; font-weight: 600; letter-spacing: -0.03em; margin-bottom: 10px; }
    .hero p { font-size: 15px; color: var(--muted); }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 100px;
      font-size: 12px;
      color: var(--muted);
      margin-top: 14px;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      background: var(--success);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

    /* Card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      margin-bottom: 20px;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .card-title { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--foreground-secondary); }

    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 13px; font-weight: 500; color: var(--foreground-secondary); margin-bottom: 6px; }
    .form-input {
      width: 100%;
      background: var(--background);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      color: var(--foreground);
      font-size: 14px;
      font-family: 'SF Mono', monospace;
    }
    .form-input:focus { outline: none; border-color: var(--foreground); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 500;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s;
      font-family: inherit;
    }

    .btn:hover { opacity: 0.9; }
    .btn-primary { background: var(--accent); color: var(--accent-foreground); width: 100%; }
    .btn-danger { background: var(--danger); color: white; width: 100%; padding: 14px; font-weight: 600; }
    .btn-danger:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Table */
    .table-container { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 20px; }
    .positions-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .positions-table th { text-align: left; padding: 12px 16px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); background: var(--background); border-bottom: 1px solid var(--border); }
    .positions-table td { padding: 14px 16px; border-bottom: 1px solid var(--border); }
    .positions-table tr:last-child td { border-bottom: none; }
    .positions-table tr:hover td { background: var(--surface-hover); }
    .symbol { font-family: 'SF Mono', monospace; font-weight: 600; }
    .mono { font-family: 'SF Mono', monospace; }
    .total-value { font-family: 'SF Mono', monospace; font-size: 18px; font-weight: 600; color: var(--success); }

    .empty-state { text-align: center; padding: 40px; color: var(--muted); font-size: 14px; }

    /* Checkbox */
    .checkbox-wrapper {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 14px;
      background: rgba(220, 38, 38, 0.05);
      border: 1px solid rgba(220, 38, 38, 0.2);
      border-radius: var(--radius);
      margin-bottom: 16px;
      cursor: pointer;
    }

    .checkbox-wrapper input { width: 16px; height: 16px; accent-color: var(--danger); margin-top: 2px; }
    .checkbox-wrapper label { font-size: 13px; color: var(--foreground-secondary); cursor: pointer; }
    .checkbox-wrapper strong { color: var(--danger); font-weight: 600; }

    /* Alert */
    .alert { padding: 14px; border-radius: var(--radius); margin-bottom: 20px; display: none; font-size: 13px; }
    .alert.active { display: block; }
    .alert-success { background: rgba(22, 163, 74, 0.1); border: 1px solid rgba(22, 163, 74, 0.3); color: var(--success); }
    .alert-warning { background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.3); color: #92400e; }
    .dark .alert-warning { color: #fbbf24; }

    /* Loading */
    .loading { display: none; text-align: center; padding: 40px; }
    .loading.active { display: block; }
    .spinner { width: 28px; height: 28px; border: 2px solid var(--border); border-top-color: var(--foreground); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading p { font-size: 13px; color: var(--muted); }

    .positions-section { display: none; }
    .positions-section.active { display: block; }

    /* Footer */
    .footer {
      margin-top: 60px;
      padding-top: 32px;
      border-top: 1px solid var(--border);
      text-align: center;
    }

    .footer-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 16px;
      color: var(--foreground);
    }

    .footer-logo svg {
      width: 24px;
      height: 24px;
    }

    .footer-brand {
      font-size: 16px;
      font-weight: 600;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 16px;
    }

    .footer-links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }

    .footer-links a:hover {
      color: var(--foreground);
    }

    .footer-copy {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .footer-disclaimer {
      font-size: 11px;
      color: var(--muted-foreground);
    }

    /* Demo Notice */
    .demo-notice {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 20px;
      font-size: 13px;
      color: var(--muted);
    }

    .demo-notice strong { color: var(--foreground); font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 2L2 9l14 7 14-7-14-7z"/>
          <path d="M2 9v14l14 7 14-7V9"/>
          <path d="M16 16v14"/>
          <path d="M16 16L2 9"/>
        </svg>
        <span class="brand-text">Liquidator</span>
      </div>
      <div class="header-controls">
        <select class="lang-selector" id="langSelect" onchange="changeLanguage(this.value)">
          <option value="zh-CN">简中</option>
          <option value="zh-TW">繁中</option>
          <option value="en">EN</option>
        </select>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
          <i data-lucide="sun" id="themeIconLight" style="display: block; width: 16px; height: 16px;"></i>
          <i data-lucide="moon" id="themeIconDark" style="display: none; width: 16px; height: 16px;"></i>
        </button>
      </div>
    </header>

    <!-- Hero -->
    <section class="hero">
      <h1 data-i18n="heroTitle">一键清仓</h1>
      <p data-i18n="heroDesc">长桥证券交易工具，本地运行，安全可靠</p>
      <div class="badge">
        <span class="badge-dot"></span>
        <span data-i18n="badgeText">本地安全模式</span>
      </div>
    </section>

    <!-- Demo Notice -->
    <div class="demo-notice">
      <i data-lucide="info" style="width: 14px; height: 14px;"></i>
      <span><strong data-i18n="demoTitle">演示模式</strong> — <span data-i18n="demoDesc">展示界面效果，不连接真实账户</span></span>
    </div>

    <!-- Config Card -->
    <div class="card" id="configCard">
      <div class="card-header">
        <i data-lucide="key" style="width: 18px; height: 18px; color: var(--muted);"></i>
        <span class="card-title" data-i18n="apiConfig">API 配置</span>
      </div>
      
      <div class="form-group">
        <label class="form-label">App Key</label>
        <input type="password" class="form-input" id="appKey" placeholder="Enter App Key">
      </div>
      
      <div class="form-group">
        <label class="form-label">App Secret</label>
        <input type="password" class="form-input" id="appSecret" placeholder="Enter App Secret">
      </div>
      
      <button class="btn btn-primary" onclick="fetchPositions()">
        <i data-lucide="bar-chart-3" style="width: 16px; height: 16px;"></i>
        <span data-i18n="viewPositions">查看持仓</span>
      </button>
    </div>

    <!-- Loading -->
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p data-i18n="loading">加载中...</p>
    </div>

    <!-- Alert -->
    <div class="alert" id="alert"></div>

    <!-- Positions -->
    <div class="card positions-section" id="positionsCard">
      <div class="card-header" style="justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <i data-lucide="trending-up" style="width: 18px; height: 18px; color: var(--muted);"></i>
          <span class="card-title" data-i18n="positions">持仓明细</span>
        </div>
        <div class="total-value" id="totalValue">$0.00</div>
      </div>
      
      <div class="table-container">
        <table class="positions-table" id="positionsTable">
          <thead>
            <tr>
              <th data-i18n="colSymbol">代码</th>
              <th data-i18n="colQty">数量</th>
              <th data-i18n="colPrice">价格</th>
              <th style="text-align: right;" data-i18n="colValue">市值</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <div class="checkbox-wrapper" onclick="document.getElementById('confirmCheck').click()">
        <input type="checkbox" id="confirmCheck" onchange="toggleLiquidateButton()">
        <label data-i18n="confirmText">我确认以<strong>市价单</strong>卖出全部持仓</label>
      </div>

      <button class="btn btn-danger" id="liquidateBtn" disabled onclick="liquidateAll()">
        <i data-lucide="zap" style="width: 16px; height: 16px;"></i>
        <span data-i18n="liquidate">一键清仓</span>
      </button>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer-logo">
        <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 2L2 9l14 7 14-7-14-7z"/>
          <path d="M2 9v14l14 7 14-7V9"/>
          <path d="M16 16v14"/>
          <path d="M16 16L2 9"/>
        </svg>
        <span class="footer-brand">Liquidator</span>
      </div>
      
      <div class="footer-links">
        <a href="https://0xechan.xyz" target="_blank">
          <i data-lucide="globe" style="width: 14px; height: 14px;"></i>
          0xechan.xyz
        </a>
        <a href="https://github.com/therealechan/longbridge-liquidator-web" target="_blank">
          <i data-lucide="github" style="width: 14px; height: 14px;"></i>
          GitHub
        </a>
      </div>
      
      <div class="footer-copy">© 2026 Liquidator · Built by 0xechan</div>
      <div class="footer-disclaimer" data-i18n="disclaimer">本工具仅供学习交流，投资有风险，操作需谨慎</div>
    </footer>
  </div>

  <script>
    // Initialize Lucide icons
    lucide.createIcons();

    // i18n Translations
    const i18n = {
      'zh-CN': {
        heroTitle: '一键清仓',
        heroDesc: '长桥证券交易工具，本地运行，安全可靠',
        badgeText: '本地安全模式',
        demoTitle: '演示模式',
        demoDesc: '展示界面效果，不连接真实账户',
        apiConfig: 'API 配置',
        viewPositions: '查看持仓',
        loading: '加载中...',
        positions: '持仓明细',
        colSymbol: '代码',
        colQty: '数量',
        colPrice: '价格',
        colValue: '市值',
        confirmText: '我确认以<strong>市价单</strong>卖出全部持仓',
        liquidate: '一键清仓',
        liquidateSuccess: '清仓完成',
        disclaimer: '本工具仅供学习交流，投资有风险，操作需谨慎'
      },
      'zh-TW': {
        heroTitle: '一鍵清倉',
        heroDesc: '長橋證券交易工具，本地運行，安全可靠',
        badgeText: '本地安全模式',
        demoTitle: '演示模式',
        demoDesc: '展示界面效果，不連接真實帳戶',
        apiConfig: 'API 配置',
        viewPositions: '查看持倉',
        loading: '載入中...',
        positions: '持倉明細',
        colSymbol: '代碼',
        colQty: '數量',
        colPrice: '價格',
        colValue: '市值',
        confirmText: '我確認以<strong>市價單</strong>賣出全部持倉',
        liquidate: '一鍵清倉',
        liquidateSuccess: '清倉完成',
        disclaimer: '本工具僅供學習交流，投資有風險，操作需謹慎'
      },
      'en': {
        heroTitle: 'Liquidate All',
        heroDesc: 'Longbridge trading tool, local-only, secure & reliable',
        badgeText: 'Local Secure Mode',
        demoTitle: 'Demo Mode',
        demoDesc: 'UI preview only, no real trading',
        apiConfig: 'API Configuration',
        viewPositions: 'View Positions',
        loading: 'Loading...',
        positions: 'Positions',
        colSymbol: 'Symbol',
        colQty: 'Quantity',
        colPrice: 'Price',
        colValue: 'Value',
        confirmText: 'I confirm to <strong>market sell</strong> all positions',
        liquidate: 'Liquidate All',
        liquidateSuccess: 'Liquidation Complete',
        disclaimer: 'For educational purposes only. Trading involves risk.'
      }
    };

    let currentLang = localStorage.getItem('liquidator-lang') || 'zh-CN';
    document.getElementById('langSelect').value = currentLang;

    function changeLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('liquidator-lang', lang);
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (i18n[lang][key]) {
          el.innerHTML = i18n[lang][key];
        }
      });
    }

    // Initialize language
    changeLanguage(currentLang);

    // Theme toggle
    function toggleTheme() {
      const html = document.documentElement;
      const iconLight = document.getElementById('themeIconLight');
      const iconDark = document.getElementById('themeIconDark');
      
      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        iconLight.style.display = 'block';
        iconDark.style.display = 'none';
        localStorage.setItem('theme', 'light');
      } else {
        html.classList.add('dark');
        iconLight.style.display = 'none';
        iconDark.style.display = 'block';
        localStorage.setItem('theme', 'dark');
      }
      lucide.createIcons();
    }

    // Load saved theme
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'light') {
      document.documentElement.classList.remove('dark');
      document.getElementById('themeIconLight').style.display = 'block';
      document.getElementById('themeIconDark').style.display = 'none';
    }

    // Mock data
    const mockPositions = [
      { symbol: "AAPL.US", quantity: 100, market_price: 185.50 },
      { symbol: "TSLA.US", quantity: 50, market_price: 242.30 },
      { symbol: "NVDA.US", quantity: 25, market_price: 875.20 },
      { symbol: "00700.HK", quantity: 200, market_price: 385.60 },
    ];

    function showLoading(show) {
      document.getElementById('loading').classList.toggle('active', show);
    }

    function showAlert(message, type = 'success') {
      const alert = document.getElementById('alert');
      alert.className = `alert alert-${type} active`;
      alert.textContent = message;
    }

    function hideAlert() {
      document.getElementById('alert').classList.remove('active');
    }

    function formatCurrency(value) {
      return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(value);
    }

    async function fetchPositions() {
      const appKey = document.getElementById('appKey').value.trim();
      const appSecret = document.getElementById('appSecret').value.trim();

      if (!appKey || !appSecret) {
        showAlert('Please enter API credentials', 'warning');
        return;
      }

      hideAlert();
      showLoading(true);
      await new Promise(r => setTimeout(r, 600));

      const totalValue = mockPositions.reduce((sum, p) => sum + (p.quantity * p.market_price), 0);
      renderPositions(mockPositions, totalValue);
      
      document.getElementById('positionsCard').classList.add('active');
      document.getElementById('configCard').style.display = 'none';
      showLoading(false);
      lucide.createIcons();
    }

    function renderPositions(positions, totalValue) {
      const tbody = document.querySelector('#positionsTable tbody');
      document.getElementById('totalValue').textContent = formatCurrency(totalValue);

      if (positions.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="empty-state">No positions</td></tr>`;
        return;
      }

      tbody.innerHTML = positions.map(pos => `
        <tr>
          <td class="symbol">${pos.symbol}</td>
          <td class="mono">${pos.quantity}</td>
          <td class="mono">${formatCurrency(pos.market_price)}</td>
          <td class="mono" style="text-align: right;">${formatCurrency(pos.quantity * pos.market_price)}</td>
        </tr>
      `).join('');
    }

    function toggleLiquidateButton() {
      document.getElementById('liquidateBtn').disabled = !document.getElementById('confirmCheck').checked;
    }

    async function liquidateAll() {
      if (!confirm(i18n[currentLang].confirmText.replace(/<[^>]*>/g, ''))) return;
      
      showLoading(true);
      await new Promise(r => setTimeout(r, 800));
      
      showAlert(i18n[currentLang].liquidateSuccess, 'success');
      renderPositions([], 0);
      document.getElementById('liquidateBtn').textContent = i18n[currentLang].liquidateSuccess;
      document.getElementById('liquidateBtn').disabled = true;
      
      showLoading(false);
    }
  </script>
</body>
</html>
