<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">

  <title>Liquidator</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none' stroke='currentColor' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M16 2L2 9l14 7 14-7-14-7z'/%3E%3Cpath d='M2 9v14l14 7 14-7V9'/%3E%3Cpath d='M16 16v14'/%3E%3Cpath d='M16 16L2 9'/%3E%3C/svg%3E" />

  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- i18n -->
  <script>

      'zh-CN': {

        badge: '本地安全模式',

        quantity: '数量',

        value: '市值',
        total: '总计',
        liquidate: '一键清仓',

        openSource: '· 开源于',
        disclaimer: '本工具仅供学习交流，投资有风险，操作需谨慎'
      },
      'zh-TW': {
        title: '一鍵清倉',
        subtitle: '長橋證券交易工具，本地運行，安全可靠',
        badge: '本地安全模式',
        demo: '演示模式',
        demoDesc: '展示界面效果，不連接真實帳戶',
        apiConfig: 'API 配置',
        appKey: 'App Key',
        appSecret: 'App Secret',
        viewPositions: '查看持倉',
        loading: '載入中...',
        positions: '持倉明細',
        symbol: '代碼',
        quantity: '數量',
        price: '價格',
        value: '市值',
        total: '總計',
        liquidate: '一鍵清倉',
        success: '清倉完成',
        footer: '© 2026 Built by',
        openSource: '· 開源於',
        disclaimer: '本工具僅供學習交流，投資有風險，操作需謹慎'
      },
      'en': {
        title: 'Liquidate All',
        subtitle: 'Longbridge trading tool, local-only, secure & reliable',
        badge: 'Local Secure Mode',
        demo: 'Demo Mode',
        demoDesc: 'UI preview only, no real trading',
        apiConfig: 'API Configuration',
        appKey: 'App Key',

        loading: 'Loading...',

        symbol: 'Symbol',

        value: 'Value',

        footer: '© 2026 Built by',
        openSource: '· Open source on',
        disclaimer: 'For educational purposes only. Trading involves risk.'
      }
    };
    
    let currentLang = localStorage.getItem('lang') || 'en';
    
    function t(key) {
      return i18n[currentLang][key] || key;
    }
    
    function setLang(lang) {
      currentLang = lang;
      localStorage.setItem('lang', lang);
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (i18n[lang][key]) el.textContent = i18n[lang][key];
      });
      // Update footer copy line
      const footerCopy = document.querySelector('.footer-copy');
      if (footerCopy && i18n[lang]) {
        const ghUrl = 'https://github.com/therealechan/longbridge-liquidator-web';
        footerCopy.innerHTML = i18n[lang].footer +
          ' <a href="https://0xechan.xyz" target="_blank" class="footer-link">0xechan</a> ' +
          i18n[lang].openSource +
          ' <a href="' + ghUrl + '" target="_blank" class="footer-link">GitHub</a>';
      }
    }
  </script>
  
  <style>
    :root {
      --background: #ffffff;
      --surface: #f4f4f5;
      --surface-hover: #e4e4e7;
      --border: #e4e4e7;
      --foreground: #18181b;
      --foreground-secondary: #3f3f46;
      --muted: #71717a;
      --muted-foreground: #a1a1aa;
      --accent: #18181b;
      --accent-foreground: #fafafa;
      --danger: #dc2626;
      --danger-hover: #b91c1c;
      --success: #16a34a;
      --radius: 6px;
      --radius-sm: 4px;
    }

    .dark {
      --background: #0a0a0a;
      --surface: #171717;
      --surface-hover: #262626;
      --border: #262626;
      --foreground: #ededed;
      --foreground-secondary: #d4d4d4;
      --muted: #737373;
      --muted-foreground: #a3a3a3;
      --accent: #fafafa;
      --accent-foreground: #171717;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html { scroll-behavior: smooth; }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--background);
      color: var(--foreground);
      line-height: 1.6;
      min-height: 100vh;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--background); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

    .container { max-width: 640px; margin: 0 auto; padding: 60px 24px 40px; }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 48px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand svg {
      width: 28px;
      height: 28px;
      color: var(--foreground);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .brand:hover svg {
      transform: rotate(12deg) scale(1.08);
    }

    .brand-text {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .lang-select {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 6px 10px;
      font-size: 13px;
      color: var(--foreground);
      cursor: pointer;
      font-family: inherit;
    }
    .lang-select:focus { outline: none; border-color: var(--foreground); }

    .lang-selector {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 6px 10px;
      font-size: 13px;
      color: var(--foreground);
      cursor: pointer;
      font-family: inherit;
    }

    .lang-selector:focus { outline: none; border-color: var(--foreground); }

    .theme-toggle {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px;
      cursor: pointer;
      color: var(--foreground);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      transition: background 0.2s, transform 0.2s;
    }

    .theme-toggle:hover { background: var(--surface); transform: scale(1.05); }
    .theme-toggle:active { transform: scale(0.95); }

    .theme-toggle .theme-icon {
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
    }

    .theme-toggle .theme-icon.entering {
      animation: themeIconIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .theme-toggle .theme-icon.leaving {
      animation: themeIconOut 0.3s ease forwards;
    }

    @keyframes themeIconIn {
      from { transform: rotate(-90deg) scale(0); opacity: 0; }
      to { transform: rotate(0deg) scale(1); opacity: 1; }
    }

    @keyframes themeIconOut {
      from { transform: rotate(0deg) scale(1); opacity: 1; }
      to { transform: rotate(90deg) scale(0); opacity: 0; }
    }

    /* Hero */
    .hero { margin-bottom: 40px; }
    .hero h1 { font-size: 36px; font-weight: 600; letter-spacing: -0.03em; margin-bottom: 10px; }
    .hero p { font-size: 15px; color: var(--muted); }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 100px;
      font-size: 12px;
      color: var(--muted);
      margin-top: 14px;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      background: var(--success);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

    /* Card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      margin-bottom: 20px;
      transition: border-color 0.3s ease;
    }

    .card:hover {
      border-color: var(--muted);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .card-title { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--foreground-secondary); }

    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 13px; font-weight: 500; color: var(--foreground-secondary); margin-bottom: 6px; }
    .form-input {
      width: 100%;
      background: var(--background);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      color: var(--foreground);
      font-size: 14px;
      font-family: 'SF Mono', monospace;
    }
    .form-input:focus { outline: none; border-color: var(--foreground); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 500;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s;
      font-family: inherit;
    }

    .btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn:active { transform: translateY(0) scale(0.98); }

    .btn .btn-icon {
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .btn:hover .btn-icon {
      transform: scale(1.15);
    }

    .btn-primary { background: var(--accent); color: var(--accent-foreground); width: 100%; }
    .btn-danger { background: var(--danger); color: white; width: 100%; padding: 14px; font-weight: 600; }
    .btn-danger:hover { box-shadow: 0 4px 14px rgba(220, 38, 38, 0.25); }
    .btn-danger:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

    /* Table */
    .table-container { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 20px; }
    .positions-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .positions-table th { text-align: left; padding: 12px 16px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); background: var(--background); border-bottom: 1px solid var(--border); }
    .positions-table td { padding: 14px 16px; border-bottom: 1px solid var(--border); }
    .positions-table tr:last-child td { border-bottom: none; }
    .positions-table tr:hover td { background: var(--surface-hover); }
    .symbol { font-family: 'SF Mono', monospace; font-weight: 600; }
    .mono { font-family: 'SF Mono', monospace; }
    .total-value { font-family: 'SF Mono', monospace; font-size: 18px; font-weight: 600; color: var(--success); }

    .empty-state { text-align: center; padding: 40px; color: var(--muted); font-size: 14px; }

    /* Alert */
    .alert { padding: 14px; border-radius: var(--radius); margin-bottom: 20px; display: none; font-size: 13px; }
    .alert.active { display: block; animation: fadeSlideIn 0.3s ease-out; }
    .alert-success { background: rgba(22, 163, 74, 0.1); border: 1px solid rgba(22, 163, 74, 0.3); color: var(--success); }
    .alert-warning { background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.3); color: #92400e; }
    .dark .alert-warning { color: #fbbf24; }

    /* Loading */
    .loading { display: none; text-align: center; padding: 40px; }
    .loading.active { display: block; }
    .spinner {
      width: 32px;
      height: 32px;
      position: relative;
      margin: 0 auto 12px;
    }
    .spinner::before,
    .spinner::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid transparent;
    }
    .spinner::before {
      border-top-color: var(--foreground);
      animation: spinnerRotate 0.8s linear infinite;
    }
    .spinner::after {
      border-bottom-color: var(--muted);
      animation: spinnerRotate 1.2s linear infinite reverse;
      inset: 3px;
    }
    @keyframes spinnerRotate { to { transform: rotate(360deg); } }
    .loading p { font-size: 13px; color: var(--muted); animation: loadingPulse 1.5s ease-in-out infinite; }
    @keyframes loadingPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

    .positions-section { display: none; }
    .positions-section.active { display: block; animation: fadeSlideIn 0.4s ease-out; }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Footer */
    .footer {
      margin-top: 60px;
      padding-top: 32px;
      border-top: 1px solid var(--border);
      text-align: center;
    }

    .footer-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      color: var(--foreground);
      max-width: 280px;
      margin-left: auto;
      margin-right: auto;
      cursor: default;
      transition: opacity 0.3s;
    }

    .footer-logo:hover svg {
      animation-play-state: paused;
      transform: rotate(8deg) scale(1.1);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .footer-logo svg {
      width: 24px;
      height: 24px;
      animation: breathe 4s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.7; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.06); }
    }

    .footer-brand {
      font-size: 16px;
      font-weight: 600;
    }

    .footer-github {
      color: var(--muted);
      margin-left: auto;
      display: flex;
      align-items: center;
      transition: color 0.2s, transform 0.2s;
    }

    .footer-github:hover {
      color: var(--foreground);
      transform: scale(1.1);
    }

    .footer-copy {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 8px;
      letter-spacing: 0.01em;
    }

    .footer-link {
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
      background-image: linear-gradient(var(--foreground), var(--foreground));
      background-size: 0% 1px;
      background-position: 0 100%;
      background-repeat: no-repeat;
      transition: color 0.2s, background-size 0.3s ease;
    }

    .footer-link:hover {
      color: var(--foreground);
      background-size: 100% 1px;
    }

    .footer-disclaimer {
      font-size: 11px;
      color: var(--muted-foreground);
    }

    /* Demo Notice */
    .demo-notice {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 20px;
      font-size: 13px;
      color: var(--muted);
    }

    .demo-notice strong { color: var(--foreground); font-weight: 600; }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0);
      backdrop-filter: blur(0px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      transition: background 0.3s ease, backdrop-filter 0.3s ease;
    }
    .modal-overlay.active {
      display: flex;
      animation: overlayIn 0.3s ease forwards;
    }
    .modal-overlay.closing {
      animation: overlayOut 0.2s ease forwards;
    }

    @keyframes overlayIn {
      from { background: rgba(0, 0, 0, 0); backdrop-filter: blur(0px); }
      to { background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); }
    }
    @keyframes overlayOut {
      from { background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); }
      to { background: rgba(0, 0, 0, 0); backdrop-filter: blur(0px); }
    }

    .modal-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      width: 100%;
      max-width: 400px;
      margin: 0 16px;
      animation: modalIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .modal-overlay.closing .modal-card {
      animation: modalOut 0.2s ease forwards;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.9) translateY(16px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    @keyframes modalOut {
      from { opacity: 1; transform: scale(1) translateY(0); }
      to { opacity: 0; transform: scale(0.95) translateY(8px); }
    }

    .modal-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--danger);
    }

    .modal-positions {
      max-height: 200px;
      overflow-y: auto;
      margin-bottom: 16px;
    }

    .modal-position-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }

    .modal-position-item:last-child { border-bottom: none; }

    .modal-position-symbol {
      font-family: 'SF Mono', monospace;
      font-weight: 600;
    }

    .modal-position-value {
      font-family: 'SF Mono', monospace;
      color: var(--muted);
    }

    .modal-total {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-top: 1px solid var(--border);
      margin-bottom: 20px;
      font-size: 14px;
      font-weight: 600;
    }

    .modal-total-value {
      font-family: 'SF Mono', monospace;
      color: var(--danger);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
    }

    .btn-secondary {
      flex: 1;
      background: var(--background);
      color: var(--foreground);
      border: 1px solid var(--border);
      padding: 10px 20px;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s, transform 0.15s;
    }

    .btn-secondary:hover { background: var(--surface-hover); transform: translateY(-1px); }
    .btn-secondary:active { transform: translateY(0); }

    .btn-modal-danger {
      flex: 1;
      background: var(--danger);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
    }

    .btn-modal-danger:hover { background: var(--danger-hover); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3); }
    .btn-modal-danger:active { transform: translateY(0); }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 2L2 9l14 7 14-7-14-7z"/>
          <path d="M2 9v14l14 7 14-7V9"/>
          <path d="M16 16v14"/>
          <path d="M16 16L2 9"/>
        </svg>
        <span class="brand-text">Liquidator</span>
      </div>
      <div class="header-controls">
        <select class="lang-select" id="langSelect" onchange="setLang(this.value)">
          <option value="zh-CN">简中</option>
          <option value="zh-TW">繁中</option>
          <option value="en">EN</option>
        </select>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
          <i data-lucide="sun" id="themeIconLight" class="theme-icon" style="display: block; width: 16px; height: 16px;"></i>
          <i data-lucide="moon" id="themeIconDark" class="theme-icon" style="display: none; width: 16px; height: 16px;"></i>
        </button>
      </div>
    </header>

    <!-- Hero -->
    <section class="hero">
      <h1 data-i18n="title">一键清仓</h1>
      <p data-i18n="subtitle">长桥证券交易工具，本地运行，安全可靠</p>
      <div class="badge">
        <span class="badge-dot"></span>
        <span data-i18n="badge">本地安全模式</span>
      </div>
    </section>

    <!-- Demo Notice -->
    <div class="demo-notice">
      <i data-lucide="info" style="width: 14px; height: 14px;"></i>
      <span><strong data-i18n="demo">演示模式</strong> — <span data-i18n="demoDesc">展示界面效果，不连接真实账户</span></span>
    </div>

    <!-- Config Card -->
    <div class="card" id="configCard">
      <div class="card-header">
        <i data-lucide="key" style="width: 18px; height: 18px; color: var(--muted);"></i>
        <span class="card-title" data-i18n="apiConfig">API 配置</span>
      </div>
      
      <div class="form-group">
        <label class="form-label" data-i18n="appKey">App Key</label>
        <input type="password" class="form-input" id="appKey" placeholder="Enter App Key">
      </div>
      
      <div class="form-group">
        <label class="form-label" data-i18n="appSecret">App Secret</label>
        <input type="password" class="form-input" id="appSecret" placeholder="Enter App Secret">
      </div>
      
      <button class="btn btn-primary" onclick="fetchPositions()">
        <i data-lucide="bar-chart-3" class="btn-icon" style="width: 16px; height: 16px;"></i>
        <span data-i18n="viewPositions">查看持仓</span>
      </button>
    </div>

    <!-- Loading -->
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p data-i18n="loading">加载中...</p>
    </div>

    <!-- Alert -->
    <div class="alert" id="alert"></div>

    <!-- Positions -->
    <div class="card positions-section" id="positionsCard">
      <div class="card-header" style="justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <i data-lucide="trending-up" style="width: 18px; height: 18px; color: var(--muted);"></i>
          <span class="card-title" data-i18n="positions">持仓明细</span>
        </div>
        <div class="total-value" id="totalValue">$0.00</div>
      </div>
      
      <div class="table-container">
        <table class="positions-table" id="positionsTable">
          <thead>
            <tr>
              <th data-i18n="symbol">代码</th>
              <th data-i18n="quantity">数量</th>
              <th data-i18n="price">价格</th>
              <th style="text-align: right;" data-i18n="value">市值</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <button class="btn btn-danger" id="liquidateBtn" onclick="openLiquidateModal()">
        <i data-lucide="zap" class="btn-icon" style="width: 16px; height: 16px;"></i>
        <span data-i18n="liquidate">一键清仓</span>
      </button>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer-logo">
        <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 2L2 9l14 7 14-7-14-7z"/>
          <path d="M2 9v14l14 7 14-7V9"/>
          <path d="M16 16v14"/>
          <path d="M16 16L2 9"/>
        </svg>
        <span class="footer-brand">Liquidator</span>
      </div>
      
      <div class="footer-copy">© 2026 Built by <a href="https://0xechan.xyz" target="_blank" class="footer-link">0xechan</a> · Open source on <a href="https://github.com/therealechan/longbridge-liquidator-web" target="_blank" class="footer-link">GitHub</a></div>
      <div class="footer-disclaimer" data-i18n="disclaimer">本工具仅供学习交流，投资有风险，操作需谨慎</div>
    </footer>
  </div>

  <!-- Liquidate Confirmation Modal -->
  <div class="modal-overlay" id="liquidateModal" onclick="closeLiquidateModal(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-title">
        <i data-lucide="alert-triangle" style="width: 18px; height: 18px;"></i>
        <span id="modalTitle">确认清仓？</span>
      </div>
      <div class="modal-positions" id="modalPositions"></div>
      <div class="modal-total">
        <span id="modalTotalLabel">总市值</span>
        <span class="modal-total-value" id="modalTotalValue">$0.00</span>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeLiquidateModal()" id="modalCancelBtn">取消</button>
        <button class="btn-modal-danger" onclick="confirmLiquidate()" id="modalConfirmBtn">确认卖出</button>
      </div>
    </div>
  </div>

  <script>
    // Initialize Lucide icons
    lucide.createIcons();

    // Language select init
    document.getElementById('langSelect').value = currentLang;
    setLang(currentLang);

    // Theme toggle
    function toggleTheme() {
      const html = document.documentElement;
      const iconLight = document.getElementById('themeIconLight');
      const iconDark = document.getElementById('themeIconDark');
      
      // Animate out current icon, animate in new icon
      const outgoing = html.classList.contains('dark') ? iconDark : iconLight;
      const incoming = html.classList.contains('dark') ? iconLight : iconDark;
      
      outgoing.classList.add('leaving');
      
      setTimeout(() => {
        if (html.classList.contains('dark')) {
          html.classList.remove('dark');
          localStorage.setItem('theme', 'light');
        } else {
          html.classList.add('dark');
          localStorage.setItem('theme', 'dark');
        }
        
        outgoing.style.display = 'none';
        outgoing.classList.remove('leaving');
        
        incoming.style.display = 'block';
        incoming.classList.add('entering');
        
        lucide.createIcons();
        
        setTimeout(() => incoming.classList.remove('entering'), 500);
      }, 200);
    }

    // Load saved theme
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'light') {
      document.documentElement.classList.remove('dark');
      document.getElementById('themeIconLight').style.display = 'block';
      document.getElementById('themeIconDark').style.display = 'none';
    } else {
      document.getElementById('themeIconLight').style.display = 'none';
      document.getElementById('themeIconDark').style.display = 'block';
    }

    // Mock data
    const mockPositions = [
      { symbol: "AAPL.US", quantity: 100, market_price: 185.50 },
      { symbol: "TSLA.US", quantity: 50, market_price: 242.30 },
      { symbol: "NVDA.US", quantity: 25, market_price: 875.20 },
      { symbol: "00700.HK", quantity: 200, market_price: 385.60 },
    ];

    let currentPositions = [];

    function showLoading(show) {
      document.getElementById('loading').classList.toggle('active', show);
    }

    function showAlert(message, type = 'success') {
      const alert = document.getElementById('alert');
      alert.className = `alert alert-${type} active`;
      alert.textContent = message;
    }

    function hideAlert() {
      document.getElementById('alert').classList.remove('active');
    }

    function formatCurrency(value) {
      return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(value);
    }

    async function fetchPositions() {
      const appKey = document.getElementById('appKey').value.trim();
      const appSecret = document.getElementById('appSecret').value.trim();

      if (!appKey || !appSecret) {
        showAlert('Please enter API credentials', 'warning');
        return;
      }

      hideAlert();
      showLoading(true);
      await new Promise(r => setTimeout(r, 600));

      currentPositions = mockPositions;
      const totalValue = currentPositions.reduce((sum, p) => sum + (p.quantity * p.market_price), 0);
      renderPositions(currentPositions, totalValue);
      
      document.getElementById('positionsCard').classList.add('active');
      document.getElementById('configCard').style.display = 'none';
      showLoading(false);
      lucide.createIcons();
    }

    function renderPositions(positions, totalValue) {
      const tbody = document.querySelector('#positionsTable tbody');
      document.getElementById('totalValue').textContent = formatCurrency(totalValue);

      if (positions.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="empty-state">No positions</td></tr>`;
        return;
      }

      tbody.innerHTML = positions.map(pos => `
        <tr>
          <td class="symbol">${pos.symbol}</td>
          <td class="mono">${pos.quantity}</td>
          <td class="mono">${formatCurrency(pos.market_price)}</td>
          <td class="mono" style="text-align: right;">${formatCurrency(pos.quantity * pos.market_price)}</td>
        </tr>
      `).join('');
    }

    // Modal i18n
    const modalI18n = {
      'zh-CN': { title: '确认清仓？', total: '总市值', cancel: '取消', confirm: '确认卖出', success: '清仓完成' },
      'zh-TW': { title: '確認清倉？', total: '總市值', cancel: '取消', confirm: '確認賣出', success: '清倉完成' },
      'en': { title: 'Confirm Liquidation?', total: 'Total Value', cancel: 'Cancel', confirm: 'Confirm Sell', success: 'Liquidation Complete' }
    };

    function openLiquidateModal() {
      if (currentPositions.length === 0) return;

      const lang = modalI18n[currentLang] || modalI18n['en'];
      document.getElementById('modalTitle').textContent = lang.title;
      document.getElementById('modalTotalLabel').textContent = lang.total;
      document.getElementById('modalCancelBtn').textContent = lang.cancel;
      document.getElementById('modalConfirmBtn').textContent = lang.confirm;

      const totalValue = currentPositions.reduce((sum, p) => sum + (p.quantity * p.market_price), 0);
      document.getElementById('modalTotalValue').textContent = formatCurrency(totalValue);

      document.getElementById('modalPositions').innerHTML = currentPositions.map(pos => `
        <div class="modal-position-item">
          <span><span class="modal-position-symbol">${pos.symbol}</span> × ${pos.quantity}</span>
          <span class="modal-position-value">${formatCurrency(pos.quantity * pos.market_price)}</span>
        </div>
      `).join('');

      document.getElementById('liquidateModal').classList.add('active');
      lucide.createIcons();
    }

    function closeLiquidateModal(event) {
      if (event && event.target !== event.currentTarget) return;
      const modal = document.getElementById('liquidateModal');
      modal.classList.add('closing');
      setTimeout(() => {
        modal.classList.remove('active', 'closing');
      }, 200);
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeLiquidateModal();
    });

    async function confirmLiquidate() {
      closeLiquidateModal();
      showLoading(true);
      await new Promise(r => setTimeout(r, 800));

      const lang = modalI18n[currentLang] || modalI18n['en'];
      showAlert(lang.success, 'success');
      currentPositions = [];
      renderPositions([], 0);
      
      const btn = document.getElementById('liquidateBtn');
      btn.innerHTML = `<i data-lucide="check" style="width: 16px; height: 16px;"></i><span>${lang.success}</span>`;
      btn.disabled = true;
      btn.style.opacity = '0.5';
      btn.style.cursor = 'not-allowed';
      
      showLoading(false);
      lucide.createIcons();
    }
  </script>
</body>
</html>
