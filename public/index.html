<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liquidator | 长桥一键清仓</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-card: #1a1a25;
      --bg-hover: #252538;
      --text-primary: #ffffff;
      --text-secondary: #a0a0b0;
      --text-muted: #606070;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-glow: rgba(99, 102, 241, 0.3);
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --danger-glow: rgba(239, 68, 68, 0.3);
      --success: #22c55e;
      --warning: #f59e0b;
      --border: #2a2a3a;
      --radius: 12px;
      --radius-sm: 8px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* Background gradient */
    .bg-gradient {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(99, 102, 241, 0.15), transparent),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(239, 68, 68, 0.08), transparent);
      pointer-events: none;
      z-index: 0;
    }

    /* Container */
    .container {
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 48px;
    }

    .header h1 {
      font-size: 42px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header p {
      color: var(--text-secondary);
      font-size: 16px;
    }

    /* Security Badge */
    .security-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(34, 197, 94, 0.1);
      color: var(--success);
      padding: 8px 16px;
      border-radius: 100px;
      font-size: 13px;
      font-weight: 500;
      margin-top: 16px;
      border: 1px solid rgba(34, 197, 94, 0.2);
    }

    .security-badge::before {
      content: '';
      width: 8px;
      height: 8px;
      background: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--success);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* Cards */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
      margin-bottom: 24px;
      transition: all 0.3s ease;
    }

    .card:hover {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }

    .card-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .card-title .icon {
      width: 36px;
      height: 36px;
      background: var(--bg-hover);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    /* Form Elements */
    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      color: var(--text-primary);
      font-size: 15px;
      font-family: 'JetBrains Mono', monospace;
      transition: all 0.2s;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .form-input::placeholder {
      color: var(--text-muted);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 28px;
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      box-shadow: 0 0 20px var(--accent-glow);
      transform: translateY(-1px);
    }

    .btn-danger {
      background: var(--danger);
      color: white;
      font-size: 16px;
      padding: 18px 36px;
    }

    .btn-danger:hover {
      background: var(--danger-hover);
      box-shadow: 0 0 30px var(--danger-glow);
    }

    .btn-danger:disabled {
      background: var(--text-muted);
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-full {
      width: 100%;
    }

    /* Positions Table */
    .positions-section {
      display: none;
    }

    .positions-section.active {
      display: block;
    }

    .positions-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .total-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 24px;
      font-weight: 600;
      color: var(--success);
    }

    .positions-table {
      width: 100%;
      border-collapse: collapse;
    }

    .positions-table th {
      text-align: left;
      padding: 16px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--border);
    }

    .positions-table td {
      padding: 20px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }

    .positions-table tr:hover td {
      background: var(--bg-hover);
    }

    .symbol {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      color: var(--accent);
    }

    .price {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Loading */
    .loading {
      display: none;
      text-align: center;
      padding: 40px;
    }

    .loading.active {
      display: block;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Alert */
    .alert {
      padding: 16px 20px;
      border-radius: var(--radius-sm);
      margin-bottom: 24px;
      display: none;
    }

    .alert.active {
      display: block;
    }

    .alert-warning {
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: var(--warning);
    }

    .alert-error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: var(--danger);
    }

    /* Footer */
    .footer {
      text-align: center;
      padding: 40px 0;
      color: var(--text-muted);
      font-size: 13px;
    }

    .footer a {
      color: var(--accent);
      text-decoration: none;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    /* Checkbox */
    .checkbox-wrapper {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 16px;
      background: rgba(239, 68, 68, 0.05);
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: var(--radius-sm);
      margin-bottom: 24px;
      cursor: pointer;
    }

    .checkbox-wrapper input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--danger);
      cursor: pointer;
      margin-top: 2px;
    }

    .checkbox-wrapper label {
      font-size: 14px;
      color: var(--text-secondary);
      cursor: pointer;
    }

    .checkbox-wrapper strong {
      color: var(--danger);
    }
  </style>
</head>
<body>
  <div class="bg-gradient"></div>
  
  <div class="container">
    <!-- Header -->
    <header class="header">
      <h1>Liquidator</h1>
      <p>长桥一键清仓工具</p>
      <div class="security-badge">
        🔒 本地运行，密钥不上传服务器
      </div>
    </header>

    <!-- API Config -->
    <div class="card" id="configCard">
      <div class="card-title">
        <span class="icon">🔑</span>
        API 配置
      </div>
      
      <div class="form-group">
        <label class="form-label">App Key</label>
        <input type="password" class="form-input" id="appKey" placeholder="输入你的 Longbridge App Key">
      </div>
      
      <div class="form-group">
        <label class="form-label">App Secret</label>
        <input type="password" class="form-input" id="appSecret" placeholder="输入你的 Longbridge App Secret">
      </div>
      
      <div class="form-group">
        <label class="form-label">Access Token (可选)</label>
        <input type="password" class="form-input" id="accessToken" placeholder="如需行情权限，输入 Access Token">
      </div>
      
      <button class="btn btn-primary btn-full" onclick="fetchPositions()">
        📊 查看持仓
      </button>
    </div>

    <!-- Loading -->
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>正在获取持仓信息...</p>
    </div>

    <!-- Alert -->
    <div class="alert" id="alert"></divu003e

    <!-- Positions -->
    <div class="card positions-section" id="positionsCard">
      <div class="positions-header">
        <div class="card-title" style="margin: 0;">
          <span class="icon">📈</span>
          当前持仓
        </div>
        <div class="total-value" id="totalValue">$0.00</div>
      </div>
      
      <table class="positions-table" id="positionsTable">
        <thead>
          <tr>
            <th>股票代码</th>
            <th>持仓数量</th>
            <th>当前价格</th>
            <th>市值</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <div class="checkbox-wrapper" onclick="document.getElementById('confirmCheck').click()">
        <input type="checkbox" id="confirmCheck" onchange="toggleLiquidateButton()">
        <label>
          我理解并确认要<strong>一键清仓</strong>所有持仓股票。
          这是一个<strong>不可撤销</strong>的操作。
        </label>
      </div>

      <button class="btn btn-danger btn-full" id="liquidateBtn" disabled onclick="liquidateAll()">
        🔥 一键清仓 (市价单)
      </button>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <p>开源工具 · 本地运行 · <a href="#" onclick="window.open('https://github.com', '_blank')">GitHub</a></p>
      <p>⚠️ 投资有风险，操作需谨慎</p>
    </footer>
  </div>

  <script>
    let currentPositions = [];
    let isLiquidating = false;

    function showLoading(show) {
      document.getElementById('loading').classList.toggle('active', show);
    }

    function showAlert(message, type = 'warning') {
      const alert = document.getElementById('alert');
      alert.className = `alert alert-${type} active`;
      alert.textContent = message;
    }

    function hideAlert() {
      document.getElementById('alert').classList.remove('active');
    }

    function formatCurrency(value) {
      return new Intl.NumberFormat('en-US', {
        style: 'currency',
        currency: 'USD'
      }).format(value);
    }

    async function fetchPositions() {
      const appKey = document.getElementById('appKey').value.trim();
      const appSecret = document.getElementById('appSecret').value.trim();
      const accessToken = document.getElementById('accessToken').value.trim();

      if (!appKey || !appSecret) {
        showAlert('请填写 App Key 和 App Secret', 'error');
        return;
      }

      hideAlert();
      showLoading(true);

      try {
        const response = await fetch('/api/positions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ appKey, appSecret, accessToken })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || '获取持仓失败');
        }

        currentPositions = data.positions || [];
        renderPositions(currentPositions, data.totalValue || 0);
        
        document.getElementById('positionsCard').classList.add('active');
        document.getElementById('configCard').style.display = 'none';

      } catch (error) {
        showAlert(error.message, 'error');
      } finally {
        showLoading(false);
      }
    }

    function renderPositions(positions, totalValue) {
      const tbody = document.querySelector('#positionsTable tbody');
      document.getElementById('totalValue').textContent = formatCurrency(totalValue);

      if (positions.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="4" class="empty-state">
              <div class="empty-state-icon">📭</div>
              <p>暂无持仓</p>
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = positions.map(pos => `
        <tr>
          <td class="symbol">${pos.symbol}</td>
          <td class="price">${pos.quantity}</td>
          <td class="price">${formatCurrency(pos.market_price)}</td>
          <td class="price">${formatCurrency(pos.quantity * pos.market_price)}</td>
        </tr>
      `).join('');
    }

    function toggleLiquidateButton() {
      const checked = document.getElementById('confirmCheck').checked;
      const btn = document.getElementById('liquidateBtn');
      btn.disabled = !checked || isLiquidating;
    }

    async function liquidateAll() {
      if (!confirm('⚠️ 确定要清仓所有持仓吗？这将使用市价单立即卖出所有股票。')) {
        return;
      }

      isLiquidating = true;
      toggleLiquidateButton();
      showLoading(true);

      const appKey = document.getElementById('appKey').value.trim();
      const appSecret = document.getElementById('appSecret').value.trim();
      const accessToken = document.getElementById('accessToken').value.trim();

      try {
        const response = await fetch('/api/liquidate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            appKey, 
            appSecret, 
            accessToken,
            positions: currentPositions.map(p => p.symbol)
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || '清仓失败');
        }

        showAlert('✅ 清仓完成！请检查长桥 App 确认订单状态。', 'warning');
        
        // 清空持仓显示
        renderPositions([], 0);
        document.getElementById('liquidateBtn').textContent = '✅ 清仓完成';

      } catch (error) {
        showAlert(error.message, 'error');
        isLiquidating = false;
        toggleLiquidateButton();
      } finally {
        showLoading(false);
      }
    }
  </script>
</body>
</html>
